<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Coordinator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #1e222d;
      --border: #2a3040;
      --text: #e8eaef;
      --muted: #8b929e;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
      --user-bg: #1d4ed8;
      --assistant-bg: #1e222d;
      --hitl-bg: #1c1910;
      --hitl-border: #ca8a04;
      --hitl-text: #fde68a;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.125rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    button.secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8125rem;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.secondary:hover:not(:disabled) {
      background: var(--border);
    }

    button.secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .agent-board {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .coordinator-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .coordinator-card {
      width: min(100%, 640px);
    }

    .specialists-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 140px;
      overflow: hidden;
    }

    .coordinator-card.agent-card {
      border-color: rgba(59, 130, 246, 0.45);
      box-shadow: 0 4px 24px rgba(59, 130, 246, 0.08);
    }

    .agent-card-header {
      padding: 0.625rem 1rem;
      border-bottom: 1px solid var(--border);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--surface-2);
      font-weight: 500;
    }

    .coordinator-card .agent-card-header {
      color: var(--accent);
    }

    .agent-card-body {
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      max-height: 300px;
      overflow-y: auto;
      flex: 1;
    }

    .agent-card-body .empty-card {
      color: var(--muted);
      font-size: 0.8125rem;
      text-align: center;
      padding: 1.25rem 0.5rem;
      line-height: 1.45;
    }

    @media (max-width: 720px) {
      .specialists-row {
        grid-template-columns: 1fr;
      }
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 22rem;
      line-height: 1.5;
      font-size: 0.9375rem;
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      font-size: 1.125rem;
      margin-bottom: 0.5rem;
    }

    .msg {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.9375rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.specialist {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-bottom-left-radius: 4px;
    }

    .msg-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    .msg.error {
      background: #2a1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 0.875rem 1rem;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      align-self: flex-start;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    #hitl {
      flex-shrink: 0;
      margin: 0 1.25rem 0.75rem;
      padding: 1rem 1.125rem;
      background: var(--hitl-bg);
      border: 1px solid var(--hitl-border);
      border-radius: var(--radius);
    }

    #hitl[hidden] { display: none !important; }

    #hitl .hitl-title {
      font-size: 0.75rem;
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hitl-text);
      margin-bottom: 0.5rem;
    }

    #hitl .hitl-specialist {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.375rem;
    }

    #hitl .hitl-specialist code {
      font-family: "JetBrains Mono", monospace;
      color: var(--hitl-text);
      background: rgba(202, 138, 4, 0.15);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
    }

    #hitl .hitl-reason {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    #hitl .hitl-completed {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .hitl-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .hitl-actions button {
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .hitl-actions button:active { transform: scale(0.98); }

    .hitl-pr-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .hitl-input {
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--hitl-border);
      background: rgba(0, 0, 0, 0.2);
      color: var(--hitl-text);
      width: 100%;
      box-sizing: border-box;
    }

    .hitl-input:focus {
      outline: none;
      border-color: var(--success);
    }

    .hitl-error {
      font-size: 0.75rem;
      color: #f87171;
    }

    .btn-approve {
      background: var(--success);
      color: #052e16;
    }

    .btn-reject {
      background: transparent;
      border: 1px solid var(--danger) !important;
      color: #fca5a5;
    }

    #input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 0.625rem;
      padding: 0.875rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #prompt {
      flex: 1;
      resize: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9375rem;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s;
    }

    #prompt:focus { border-color: var(--accent); }
    #prompt:disabled { opacity: 0.5; }

    #send {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0 1.25rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 4.5rem;
    }

    #send:hover:not(:disabled) { background: var(--accent-dim); }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>QA Coordinator</h1>
      <p>Delegates to code &amp; requirement specialists · HITL enabled</p>
    </div>
    <div class="header-actions">
      <button type="button" class="secondary" id="new-chat">New chat</button>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <strong>Start a review</strong>
      Ask about a pull request, code quality, or requirement coverage. You'll approve each specialist delegation before it runs.
    </div>
    <div id="agent-board" hidden>
      <div class="coordinator-row">
        <div class="agent-card coordinator-card">
          <div class="agent-card-header">Coordinator</div>
          <div class="agent-card-body" id="card-coordinator"></div>
        </div>
      </div>
      <div class="specialists-row">
        <div class="agent-card">
          <div class="agent-card-header">Code</div>
          <div class="agent-card-body" id="card-code"></div>
        </div>
        <div class="agent-card">
          <div class="agent-card-header">Requirements</div>
          <div class="agent-card-body" id="card-requirements"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="hitl" hidden></div>

  <div id="input-bar">
    <textarea id="prompt" rows="2" placeholder="Message QA coordinator…"></textarea>
    <button type="button" id="send">Send</button>
  </div>

  <script>
    let threadId = null;
    let busy = false;
    let pendingApproval = false;
    let groups = { coordinator: [], code: [], requirements: [] };

    const messagesEl = document.getElementById("messages");
    const boardEl = document.getElementById("agent-board");
    const cardEls = {
      coordinator: document.getElementById("card-coordinator"),
      code: document.getElementById("card-code"),
      requirements: document.getElementById("card-requirements"),
    };
    const hitlEl = document.getElementById("hitl");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    const CARD_EMPTY = {
      coordinator: "User messages and coordinator replies appear here.",
      code: "Code analysis results will appear here.",
      requirements: "Requirement analysis results will appear here.",
    };

    function tabFor(agent) {
      if (agent === "code" || agent === "requirements") return agent;
      return "coordinator";
    }

    function styleFor(agent) {
      if (agent === "error") return "error";
      if (agent === "user") return "user";
      if (agent === "coordinator") return "assistant";
      return "specialist";
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value || pendingApproval;
      promptEl.disabled = value || pendingApproval;
      newChatBtn.disabled = value;
    }

    function hasAnyMessages() {
      return Object.values(groups).some((items) => items.length > 0);
    }

    function hideEmptyState() {
      const empty = document.getElementById("empty-state");
      if (empty) empty.hidden = true;
      boardEl.hidden = false;
    }

    function showEmptyState() {
      const empty = document.getElementById("empty-state");
      if (empty) empty.hidden = false;
      boardEl.hidden = true;
    }

    function createMessageEl(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      return div;
    }

    function renderCard(agent, items) {
      const body = cardEls[agent];
      body.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty-card";
        empty.textContent = CARD_EMPTY[agent];
        body.appendChild(empty);
        return;
      }
      for (const m of items) {
        body.appendChild(createMessageEl(styleFor(m.agent), m.text));
      }
      body.scrollTop = body.scrollHeight;
    }

    function setMessages(messages) {
      groups = { coordinator: [], code: [], requirements: [] };
      for (const m of messages) {
        groups[tabFor(m.agent)].push(m);
      }
      renderAll();
    }

    function renderAll() {
      if (!hasAnyMessages()) {
        showEmptyState();
        return;
      }
      hideEmptyState();
      renderCard("coordinator", groups.coordinator);
      renderCard("code", groups.code);
      renderCard("requirements", groups.requirements);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendError(text) {
      hideEmptyState();
      groups.coordinator.push({ agent: "error", text });
      renderAll();
    }

    let typingEl = null;

    function showTyping() {
      hideEmptyState();
      typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.innerHTML = "<span></span><span></span><span></span>";
      cardEls.coordinator.appendChild(typingEl);
      cardEls.coordinator.scrollTop = cardEls.coordinator.scrollHeight;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      if (typingEl) {
        typingEl.remove();
        typingEl = null;
      }
    }

    function showHitl(request) {
      pendingApproval = true;
      promptEl.disabled = true;
      sendBtn.disabled = true;
      hitlEl.hidden = false;

      if (request.type === "request_pr_url") {
        showPrUrlHitl(request);
      } else {
        showDelegationHitl(request);
      }
    }

    function showDelegationHitl(request) {
      const completed = request.completed?.length
        ? `Already consulted: ${request.completed.join(", ")}`
        : "No specialists consulted yet.";

      hitlEl.innerHTML = `
        <div class="hitl-title">Approval required</div>
        <div class="hitl-specialist">Delegate to <code>${escapeHtml(request.proposed_next)}</code> specialist</div>
        <div class="hitl-reason">${escapeHtml(request.reason)}</div>
        <div class="hitl-completed">${escapeHtml(completed)}</div>
        <div class="hitl-actions">
          <button type="button" class="btn-approve" data-action="approve">Approve</button>
          <button type="button" class="btn-reject" data-action="reject">Reject &amp; finish</button>
        </div>
      `;

      hitlEl.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => resume({ action: btn.dataset.action }));
      });
    }

    const PR_URL_RE = /^https?:\/\/github\.com\/[\w.-]+\/[\w.-]+\/pull\/\d+/;

    function showPrUrlHitl(request) {
      const prompt = request.prompt || "Paste the GitHub PR URL.";
      hitlEl.innerHTML = `
        <div class="hitl-title">PR details needed</div>
        <div class="hitl-reason">${escapeHtml(prompt)}</div>
        <div class="hitl-pr-form">
          <input type="url" id="pr-url-input" class="hitl-input"
            placeholder="https://github.com/owner/repo/pull/123" autocomplete="off" />
          <div class="hitl-error" id="pr-url-error" hidden>Enter a valid GitHub PR URL.</div>
          <div class="hitl-actions">
            <button type="button" class="btn-approve" id="pr-url-submit">Submit</button>
          </div>
        </div>
      `;

      const input = hitlEl.querySelector("#pr-url-input");
      const errorEl = hitlEl.querySelector("#pr-url-error");
      const submitBtn = hitlEl.querySelector("#pr-url-submit");

      const submit = () => {
        const value = input.value.trim();
        if (!PR_URL_RE.test(value)) {
          errorEl.hidden = false;
          input.focus();
          return;
        }
        resume({ pr_url: value });
      };

      submitBtn.addEventListener("click", submit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          submit();
        }
      });
      input.focus();
    }

    function hideHitl() {
      pendingApproval = false;
      hitlEl.hidden = true;
      hitlEl.innerHTML = "";
      promptEl.disabled = false;
      sendBtn.disabled = false;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function handleResponse(data) {
      threadId = data.thread_id;

      if (data.messages) {
        setMessages(data.messages);
      }

      if (data.status === "paused") {
        hideTyping();
        setBusy(false);
        showHitl(data.request);
        return;
      }

      hideHitl();
      hideTyping();
      setBusy(false);
    }

    async function apiPost(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail ?? res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    async function sendMessage() {
      const text = promptEl.value.trim();
      if (!text || busy || pendingApproval) return;

      groups.coordinator.push({ agent: "user", text });
      renderAll();
      promptEl.value = "";
      setBusy(true);
      showTyping();

      try {
        const data = await apiPost("/api/agent/coordinator/chat", {
          prompt: text,
          thread_id: threadId,
        });
        await handleResponse(data);
      } catch (err) {
        hideTyping();
        setBusy(false);
        appendError(err.message || "Request failed");
      }
    }

    async function resume(value) {
      if (!threadId || busy) return;

      hideHitl();
      setBusy(true);
      showTyping();

      try {
        const data = await apiPost("/api/agent/coordinator/resume", {
          thread_id: threadId,
          value,
        });
        await handleResponse(data);
      } catch (err) {
        hideTyping();
        setBusy(false);
        appendError(err.message || "Resume failed");
      }
    }

    function newChat() {
      if (busy) return;
      threadId = null;
      pendingApproval = false;
      groups = { coordinator: [], code: [], requirements: [] };
      hideHitl();
      hideTyping();
      showEmptyState();
      promptEl.value = "";
      promptEl.disabled = false;
      sendBtn.disabled = false;
    }

    sendBtn.addEventListener("click", sendMessage);

    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    newChatBtn.addEventListener("click", newChat);
  </script>
</body>
</html>
