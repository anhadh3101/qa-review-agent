<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Coordinator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #1e222d;
      --border: #2a3040;
      --text: #e8eaef;
      --muted: #8b929e;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
      --user-bg: #1d4ed8;
      --assistant-bg: #1e222d;
      --hitl-bg: #1c1910;
      --hitl-border: #ca8a04;
      --hitl-text: #fde68a;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.125rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    button.secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8125rem;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.secondary:hover:not(:disabled) {
      background: var(--border);
    }

    button.secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 22rem;
      line-height: 1.5;
      font-size: 0.9375rem;
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      font-size: 1.125rem;
      margin-bottom: 0.5rem;
    }

    .msg {
      max-width: min(640px, 85%);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.9375rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.specialist {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-bottom-left-radius: 4px;
    }

    .msg-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    .msg.error {
      align-self: center;
      background: #2a1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      max-width: 90%;
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 0.875rem 1rem;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    #hitl {
      flex-shrink: 0;
      margin: 0 1.25rem 0.75rem;
      padding: 1rem 1.125rem;
      background: var(--hitl-bg);
      border: 1px solid var(--hitl-border);
      border-radius: var(--radius);
    }

    #hitl[hidden] { display: none !important; }

    #hitl .hitl-title {
      font-size: 0.75rem;
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hitl-text);
      margin-bottom: 0.5rem;
    }

    #hitl .hitl-specialist {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.375rem;
    }

    #hitl .hitl-specialist code {
      font-family: "JetBrains Mono", monospace;
      color: var(--hitl-text);
      background: rgba(202, 138, 4, 0.15);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
    }

    #hitl .hitl-reason {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    #hitl .hitl-completed {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .hitl-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .hitl-actions button {
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .hitl-actions button:active { transform: scale(0.98); }

    .btn-approve {
      background: var(--success);
      color: #052e16;
    }

    .btn-reject {
      background: transparent;
      border: 1px solid var(--danger) !important;
      color: #fca5a5;
    }

    #input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 0.625rem;
      padding: 0.875rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #prompt {
      flex: 1;
      resize: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9375rem;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s;
    }

    #prompt:focus { border-color: var(--accent); }
    #prompt:disabled { opacity: 0.5; }

    #send {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0 1.25rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 4.5rem;
    }

    #send:hover:not(:disabled) { background: var(--accent-dim); }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>QA Coordinator</h1>
      <p>Delegates to code &amp; requirement specialists · HITL enabled</p>
    </div>
    <div class="header-actions">
      <button type="button" class="secondary" id="new-chat">New chat</button>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <strong>Start a review</strong>
      Ask about a pull request, code quality, or requirement coverage. You'll approve each specialist delegation before it runs.
    </div>
  </div>

  <div id="hitl" hidden></div>

  <div id="input-bar">
    <textarea id="prompt" rows="2" placeholder="Message QA coordinator…"></textarea>
    <button type="button" id="send">Send</button>
  </div>

  <script>
    let threadId = null;
    let busy = false;
    let pendingApproval = false;

    const messagesEl = document.getElementById("messages");
    const hitlEl = document.getElementById("hitl");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value || pendingApproval;
      promptEl.disabled = value || pendingApproval;
      newChatBtn.disabled = value;
    }

    function hideEmptyState() {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();
    }

    function appendMessage(role, text, label) {
      hideEmptyState();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (label) {
        const lbl = document.createElement("div");
        lbl.className = "msg-label";
        lbl.textContent = label;
        div.appendChild(lbl);
      }
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(body);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function appendError(text) {
      appendMessage("error", text);
    }

    let typingEl = null;

    function showTyping() {
      hideEmptyState();
      typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      if (typingEl) {
        typingEl.remove();
        typingEl = null;
      }
    }

    function showHitl(request) {
      pendingApproval = true;
      promptEl.disabled = true;
      sendBtn.disabled = true;

      const completed = request.completed?.length
        ? `Already consulted: ${request.completed.join(", ")}`
        : "No specialists consulted yet.";

      hitlEl.hidden = false;
      hitlEl.innerHTML = `
        <div class="hitl-title">Approval required</div>
        <div class="hitl-specialist">Delegate to <code>${escapeHtml(request.proposed_next)}</code> specialist</div>
        <div class="hitl-reason">${escapeHtml(request.reason)}</div>
        <div class="hitl-completed">${escapeHtml(completed)}</div>
        <div class="hitl-actions">
          <button type="button" class="btn-approve" data-action="approve">Approve</button>
          <button type="button" class="btn-reject" data-action="reject">Reject &amp; finish</button>
        </div>
      `;

      hitlEl.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => resume({ action: btn.dataset.action }));
      });
    }

    function hideHitl() {
      pendingApproval = false;
      hitlEl.hidden = true;
      hitlEl.innerHTML = "";
      promptEl.disabled = false;
      sendBtn.disabled = false;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function handleResponse(data) {
      threadId = data.thread_id;

      if (data.status === "paused") {
        hideTyping();
        setBusy(false);
        showHitl(data.request);
        return;
      }

      hideHitl();
      hideTyping();
      setBusy(false);
      threadId = null;

      if (data.result) {
        appendMessage("assistant", data.result);
      }
    }

    async function apiPost(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail ?? res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    async function sendMessage() {
      const text = promptEl.value.trim();
      if (!text || busy || pendingApproval) return;

      appendMessage("user", text);
      promptEl.value = "";
      setBusy(true);
      showTyping();

      try {
        const data = await apiPost("/api/agent/coordinator/chat", { prompt: text });
        await handleResponse(data);
      } catch (err) {
        hideTyping();
        setBusy(false);
        appendError(err.message || "Request failed");
      }
    }

    async function resume(value) {
      if (!threadId || busy) return;

      hideHitl();
      setBusy(true);
      showTyping();

      const actionLabel =
        value.action === "approve"
          ? `Approved delegation`
          : `Rejected — finishing review`;

      appendMessage("user", actionLabel, "You");

      try {
        const data = await apiPost("/api/agent/coordinator/resume", {
          thread_id: threadId,
          value,
        });
        await handleResponse(data);
      } catch (err) {
        hideTyping();
        setBusy(false);
        appendError(err.message || "Resume failed");
      }
    }

    function newChat() {
      if (busy) return;
      threadId = null;
      pendingApproval = false;
      hideHitl();
      hideTyping();
      messagesEl.innerHTML = `
        <div class="empty-state" id="empty-state">
          <strong>Start a review</strong>
          Ask about a pull request, code quality, or requirement coverage. You'll approve each specialist delegation before it runs.
        </div>
      `;
      promptEl.value = "";
      promptEl.disabled = false;
      sendBtn.disabled = false;
    }

    sendBtn.addEventListener("click", sendMessage);

    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    newChatBtn.addEventListener("click", newChat);
  </script>
</body>
</html>
